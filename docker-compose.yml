version: '3.8'

services:
  # 1. Discover Karabakh Backend & WebSockets
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discoverkarabakh_backend
    restart: always
    ports:
      - "80:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/discoverkarabakh
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - FRONTEND_WEB_URL=${FRONTEND_WEB_URL:-http://191.218.163.50,http://localhost:5173}
      - FRONTEND_VENDOR_URL=${FRONTEND_VENDOR_URL:-http://191.218.163.50/vendor,http://localhost:5174}
      - FRONTEND_ADMIN_URL=${FRONTEND_ADMIN_URL:-http://191.218.163.50/admin,http://localhost:5175}
      # Cloudflare R2 / AWS S3 Configs (optional if using local uploads)
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads_data:/app/back/uploads

  # 2. Managed MySQL Database
  mysql:
    image: mysql:8.0
    container_name: discoverkarabakh_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret_mysql_pass}
      MYSQL_DATABASE: discoverkarabakh
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Cache & BullMQ Queue
  redis:
    image: redis:7-alpine
    container_name: discoverkarabakh_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  uploads_data:
